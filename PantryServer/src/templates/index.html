<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pantry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
<div class="max-w-xl mx-auto p-4">

    <header class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-semibold">🥫 Pantry</h1>
    </header>

    <form
        class="flex gap-2 mb-2"
        hx-post="/ui/items/add"
        hx-target="#item-list ul"
        hx-swap="beforeend"
        hx-on::after-request="if (event.detail.elt === this) { this.reset(); document.getElementById('suggestions').innerHTML=''; }"
        autocomplete="off"
    >
        <input
            name="name"
            required
            placeholder="Add item…"
            autocomplete="off"
            class="flex-1 px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 bg-white"
            hx-get="/ui/items/suggest"
            hx-trigger="keyup changed delay:200ms, focus"
            hx-target="#suggestions"
            hx-swap="innerHTML"
        >
        <button class="px-4 py-2 rounded-lg bg-gray-900 text-white font-medium">
            Add
        </button>
    </form>
    <div id="suggestions" class="mb-4"></div>

    <script>
        window.pickSuggestion = function(name) {
            const input = document.querySelector('input[name=name]');
            input.value = name;
            input.focus();
            document.getElementById('suggestions').innerHTML = '';
        };
    </script>

    {% include "_item_list.html" %}

</div>
</body>
</html>
