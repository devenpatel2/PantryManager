<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pantry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .chip { @apply px-3 py-1 rounded-full text-sm font-medium border border-gray-300 text-gray-700; }
        .chip.active { @apply bg-gray-900 text-white border-gray-900; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
<div class="max-w-xl mx-auto p-4">

    <header class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-semibold">🥫 Pantry</h1>
    </header>

    <form
        class="flex gap-2 mb-4"
        hx-post="/ui/items/add"
        hx-target="#item-list ul"
        hx-swap="beforeend"
        hx-on::after-request="this.reset()"
    >
        <input
            name="name"
            required
            placeholder="Add item…"
            class="flex-1 px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 bg-white"
        >
        <button class="px-4 py-2 rounded-lg bg-gray-900 text-white font-medium">
            Add
        </button>
    </form>

    <div class="flex flex-wrap gap-2 mb-4">
        {% for label, value in [("All", "all"), ("Out", "out"), ("In", "in"), ("Surplus", "surplus")] %}
        <button
            class="chip {% if active_filter == value %}active{% endif %}"
            hx-get="/ui/items/list?filter={{ value }}"
            hx-target="#item-list"
            hx-swap="outerHTML"
        >{{ label }}</button>
        {% endfor %}
    </div>

    {% include "_item_list.html" %}

</div>
</body>
</html>
